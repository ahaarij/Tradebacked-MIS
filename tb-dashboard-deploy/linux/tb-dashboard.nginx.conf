# Tradebacked MIS dashboard - Nginx site (written by install.sh)
# Placeholders __DOMAIN__, __WEBROOT__, __HTPASSWD__ and #__ALLOW__ are filled in by the installer.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root  __WEBROOT__;
    index index.html;

    # A login is required for every file on this site
    auth_basic           "Tradebacked MIS";
    auth_basic_user_file __HTPASSWD__;

    # Optional IP allow-list
#__ALLOW__

    # Keep the page private: no search indexing, no caching, no embedding in other sites
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Hide temp files written while a new dashboard is being published
    location ~ /\. { return 404; }

    location = /robots.txt { auth_basic off; allow all; }

    location / { try_files $uri $uri/ =404; }

    client_max_body_size 1m;
    access_log /var/log/nginx/tb-dashboard.access.log;
    error_log  /var/log/nginx/tb-dashboard.error.log;
}
